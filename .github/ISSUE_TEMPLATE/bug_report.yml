name: Bug report
description: Something in Aura doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you said or did, what Aura did, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the API and the app
        2. Say "brief me"
        3. ...
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M2, macOS 26.1
  - type: input
    id: ai
    attributes:
      label: AI provider and model
      placeholder: ollama, qwen3:8b
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The API's Terminal output around the problem. Remove any email addresses, names or keys first.
      render: text
