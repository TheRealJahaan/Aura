name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aura"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aura:aura@localhost:5432/aura?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (every workspace)
        run: npm test
      - name: Migrate database
        run: npx prisma migrate deploy
        working-directory: apps/api
      - name: API e2e tests
        run: npm run test:e2e -w apps/api
      - name: Build API
        run: npm run build -w apps/api
      - name: Install Chromium for the UI tests
        run: npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - name: Desktop UI tests
        run: npm run test:ui -w apps/desktop
      - name: Electron smoke test
        run: xvfb-run -a npm run test:smoke -w apps/desktop
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
