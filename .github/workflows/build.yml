# Runs the tests and builds the Android app on every push to main.
# The newest app is attached as jarvis.apk to the "app-latest" release, so anyone can install it without Android Studio.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y libportaudio2
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis.apk
      - name: Publish to the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || \
            gh release create app-latest --title "Jarvis app (latest)" --latest \
              --notes "The newest Jarvis Android app, built from main. Download jarvis.apk on your phone and open it."
          gh release upload app-latest jarvis.apk --clobber
