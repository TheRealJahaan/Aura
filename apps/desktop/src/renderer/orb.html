<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob: data: https://*.picovoice.ai https://*.picovoice.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:"
    />
    <title>Aura</title>
    <link rel="stylesheet" href="orb.css" />
  </head>
  <body data-mode="idle">
    <main class="shell">
      <button class="close" id="close" title="Close (Esc)" aria-label="Close">×</button>
      <div class="orb-wrap" id="orb" role="button" aria-label="Talk to Aura" tabindex="0">
        <div class="orb">
          <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
          <span class="core"></span>
        </div>
      </div>
      <p class="status" id="status" aria-live="polite">Ready</p>
      <p class="heard" id="heard"></p>
      <p class="reply" id="reply" aria-live="polite"></p>

      <section class="confirm" id="confirm" hidden aria-label="Confirm action">
        <h2 id="confirm-title"></h2>
        <dl id="confirm-details"></dl>
        <div class="buttons">
          <button id="cancel" class="secondary">Cancel</button>
          <button id="approve" class="primary">Go ahead</button>
        </div>
        <p class="hint">Or just say "yes" or "no".</p>
      </section>

      <form class="type" id="type-form" hidden>
        <input id="type-input" type="text" maxlength="2000" placeholder="Type a command…" autocomplete="off" aria-label="Command" />
      </form>

      <footer class="footer">
        <span id="hint"></span>
        <button id="type-toggle" class="link">Type instead</button>
      </footer>
    </main>
    <script type="module" src="orb.js"></script>
  </body>
</html>
